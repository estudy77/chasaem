<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차샘 운전교실</title>
<style>
  html, body{
    margin:0;
    height:100%;
    overflow:hidden;
  }
  iframe{
    border:0;
    width:100%;
    height:100%;
    display:block;
  }
  .fallback{
    display:none;
    align-items:center;
    justify-content:center;
    height:100%;
    font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
    background:#f5f7fb;
    color:#141a24;
  }
  .fallback a{ color:#2a78d6; }
</style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbxsHzw6ZH5Galf9KWmvstHuadm_k6Fkg4-kuWT9KFdggelWX4st6hrnhMnW0Fq3cAMulQ/exec"
          title="차샘 운전교실"
          onerror="document.querySelector('iframe').style.display='none'; document.querySelector('.fallback').style.display='flex';"></iframe>
  <div class="fallback">
    <p>화면이 안 보이면 <a href="https://script.google.com/macros/s/AKfycbxsHzw6ZH5Galf9KWmvstHuadm_k6Fkg4-kuWT9KFdggelWX4st6hrnhMnW0Fq3cAMulQ/exec">여기를 클릭</a>하세요.</p>
  </div>
</body>
</html>
